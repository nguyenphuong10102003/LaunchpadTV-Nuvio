name: Auto Fetch Xperience Movies for Launchpad

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Movies and Convert to M3U
        run: |
          MANIFEST_URL="https://xperience-app.com/manifest/0f6ce502-95d4-46ad-842c-426f387c391c/eyJhbGciOiJIUzI1NiJ9.eyJwaWQiOiIwZjZjZTUwMi05NWQ0LTQ2YWQtODQyYy00MjZmMzg3YzM5MWMiLCJraWQiOiI2NjVmODRjNS04YzczLTQyZjYtOTY1YS1lNDY3YTllMjBmMDAiLCJzY29wZSI6Im1hbmlmZXN0Iiwic3ViIjoiMzVlN2M5MzctNjI4YS00NmY2LWFlZjMtZmVlNmQ3NGM0NDViIiwiaWF0IjowfQ.-RbqiKLp3i55fKXlualcmJsv9ViRf0GWjEge6_7EkGw/manifest.json"
          BASE_URL=$(echo "$MANIFEST_URL" | sed 's|/manifest.json$||')

          # 1. Lấy dữ liệu catalog phim
          echo "Đang gọi API..."
          curl -s "$BASE_URL/catalog/movie/top.json" -o raw.json || curl -s "https://v3-cinemeta.strem.io/catalog/movie/top.json" -o raw.json

          # 2. Tạo file playlist M3U chuẩn cho mục Truyền hình Launchpad
          echo "#EXTM3U" > movies.m3u

          jq -r '.metas[0:30][]? | "#EXTINF:-1 tvg-logo=\"" + (.poster // "") + "\" group-title=\"Phim Đề Xuất\"," + .name + "\nnuvio://detail/movie/" + .id' raw.json >> movies.m3u

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add movies.m3u
          git commit -m "auto: generate movies.m3u playlist" || exit 0
          git push
