name: Auto Fetch Xperience Movies for Launchpad

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Movies from Xperience Catalog
        run: |
          MANIFEST_URL="https://xperience-app.com/manifest/0f6ce502-95d4-46ad-842c-426f387c391c/eyJhbGciOiJIUzI1NiJ9.eyJwaWQiOiIwZjZjZTUwMi05NWQ0LTQ2YWQtODQyYy00MjZmMzg3YzM5MWMiLCJraWQiOiI2NjVmODRjNS04YzczLTQyZjYtOTY1YS1lNDY3YTllMjBmMDAiLCJzY29wZSI6Im1hbmlmZXN0Iiwic3ViIjoiMzVlN2M5MzctNjI4YS00NmY2LWFlZjMtZmVlNmQ3NGM0NDViIiwiaWF0IjowfQ.-RbqiKLp3i55fKXlualcmJsv9ViRf0GWjEge6_7EkGw/manifest.json"
          BASE_URL=$(echo "$MANIFEST_URL" | sed 's|/manifest.json$||')

          # Tải catalog phim từ Xperience
          curl -s "$BASE_URL/catalog/movie/top.json" -o xperience_raw.json || curl -s "$BASE_URL/catalog/movie/popular.json" -o xperience_raw.json

          # Xuất ra file movies.json với cấu trúc IPTV/VOD Object chuẩn
          jq '{
            name: "Đề xuất Phim Xperience",
            channels: [.metas[]? | {
              name: .name,
              logo: .poster,
              group: "Phim Hot",
              url: ("nuvio://detail/movie/" + .id)
            }]
          }' xperience_raw.json > movies.json

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add movies.json
          git commit -m "auto: fix movies.json structure for Launchpad" || exit 0
          git push
